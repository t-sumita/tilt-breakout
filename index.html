<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TILT BREAKOUT</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="hud-row">
      <span>STAGE <b id="hud-stage">1/3</b></span>
      <span>BALLS <b id="hud-lives">3</b></span>
      <span>SCORE <b id="hud-score">0000</b></span>
    </div>
    <div class="hud-row">
      <span>HIGH <b id="hud-highscore">0000</b></span>
      <span>TIME <b id="hud-time">3:00</b></span>
      <button id="config-btn" class="config-btn" type="button" aria-label="設定を開く">⚙</button>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="stage" width="400" height="560"></canvas>
    <div id="overlay" class="overlay"><span id="overlay-text"></span></div>
    <div id="config-panel" class="config-panel" hidden>
      <div class="config-panel-inner">
        <button id="config-close" class="config-close" type="button" aria-label="設定を閉じる">×</button>
        <h2>CONFIG</h2>
        <label class="config-field">
          <span>パドル移動速度 <b id="val-paddleMoveSpeedMultiplier"></b></span>
          <input id="cfg-paddleMoveSpeedMultiplier" type="range">
        </label>
        <label class="config-field">
          <span>重力 <b id="val-gravity"></b></span>
          <input id="cfg-gravity" type="range">
        </label>
        <label class="config-field">
          <span>空気抵抗 <b id="val-drag"></b></span>
          <input id="cfg-drag" type="range">
        </label>
        <label class="config-field">
          <span>制限時間(秒) <b id="val-timeLimitSec"></b></span>
          <input id="cfg-timeLimitSec" type="range">
        </label>
        <label class="config-field">
          <span>ボール数 <b id="val-livesStart"></b></span>
          <input id="cfg-livesStart" type="range">
        </label>
        <label class="config-field">
          <span>キャッチ速度しきい値 <b id="val-catchSpeedThreshold"></b></span>
          <input id="cfg-catchSpeedThreshold" type="range">
        </label>
        <label class="config-field">
          <span>ステージ選択</span>
          <select id="cfg-stageSelect">
            <option value="0">STAGE 1</option>
            <option value="1">STAGE 2</option>
            <option value="2">STAGE 3</option>
          </select>
        </label>
        <button id="config-reset" class="config-reset" type="button">規定値に戻す</button>
        <p class="config-note">※ ステージ選択でジャンプするとオールクリア判定の対象外になります</p>
        <button id="config-maintenance" class="config-maintenance" type="button">メンテナンス</button>
      </div>
    </div>
  </div>
  <p class="hint">1本指スワイプ: パドル移動 / 2本指タッチ: 傾き調整<br>矢印キー: 移動・Q/E: 傾き・Space: 発射</p>
</div>

<script type="module" src="js/main.js"></script>
