<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ステージ確認モック</title>
<style>
  :root{
    --bg:#0b1020; --panel:#0f1630; --line:#7fe3d4;
    --line-dim:rgba(127,227,212,0.35); --fill-solid:rgba(127,227,212,0.16);
    --text:#dff7f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Courier New',ui-monospace,monospace;}
  .wrap{max-width:440px;margin:0 auto;padding:14px 12px 24px;}
  .hud{display:flex;justify-content:space-between;font-size:13px;
    letter-spacing:0.06em;padding:0 4px 8px;color:var(--line);}
  .hud b{color:var(--text);font-weight:700;margin-left:4px;}
  canvas{width:100%;height:auto;display:block;background:var(--panel);
    border:1px solid var(--line-dim);touch-action:none;}
  .controls{display:flex;gap:8px;margin-top:12px;}
  button{flex:1;padding:10px 6px;background:transparent;color:var(--line);
    border:1px solid var(--line);font-family:inherit;font-size:12px;letter-spacing:0.03em;}
  button:active{background:var(--fill-solid);}
  .hint{font-size:11px;color:#7d94a8;text-align:center;margin-top:10px;line-height:1.6;}
  .legend{display:flex;gap:14px;justify-content:center;font-size:10px;color:#7d94a8;margin-top:6px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:4px;}
  .sw{width:10px;height:10px;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>BALLS <b id="balls">2</b></span>
    <span>SCORE <b id="score">000</b>/100</span>
    <span>TIME <b id="time">60.0</b></span>
  </div>
  <canvas id="stage" width="400" height="560"></canvas>
  <div class="controls">
    <button id="tiltL">◤ 左上げ</button>
    <button id="stageBtn">ステージ切替 (1/3)</button>
    <button id="tiltR">左下げ ◢</button>
  </div>
  <div class="legend">
    <span><span class="sw" style="background:rgba(127,227,212,0.35)"></span>消せるブロック</span>
    <span><span class="sw" style="border:1px solid #7fe3d4"></span>ジャマー</span>
  </div>
  <p class="hint">1本指スワイプ:パドル移動 / 2本指:傾き調整<br>2面の中央ブロック・3面の中心コアはタップで数値が確定します。</p>
</div>
<script>
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cx = W/2;
const STAGE_COUNT = 3;

let stageIndex = 1;
const stageBtn = document.getElementById('stageBtn');
stageBtn.onclick = () => {
  stageIndex = stageIndex % STAGE_COUNT + 1;
  stageBtn.textContent = `ステージ切替 (${stageIndex}/${STAGE_COUNT})`;
};

// ---- paddle ----
const PADDLE_HALF_W = 30;
const PADDLE_Y_MAX = H - 50;
const PADDLE_Y_MIN = H / 3;
const PADDLE_X_MIN = PADDLE_HALF_W + 5, PADDLE_X_MAX = W - PADDLE_HALF_W - 5;
let paddleX = W/2, paddleY = PADDLE_Y_MAX, paddleTilt = 0;
function speedFactor(y){
  const t = (PADDLE_Y_MAX - y) / (PADDLE_Y_MAX - PADDLE_Y_MIN);
  return 1 - Math.min(Math.max(t,0),1) * 0.6;
}

// ---- ring core (stage3) ----
const cyRing = 190;
const CORE_RADIUS = 24;
let ringCoreHp = null;
function hitCoreIfNeeded(){ if(ringCoreHp === null) ringCoreHp = 10 + Math.floor(Math.random()*90); }

// ---- bastion center square (stage2): 最初は?表示、タップで確定 ----
const cyB = 210;
let squareRevealed = false;
const SQUARE = {x:0, y:-100, w:70, h:70, hp:24};

const pointers = new Map();
function toCanvasPoint(clientX, clientY){
  const r = cv.getBoundingClientRect();
  const s = W / r.width;
  return { x: (clientX - r.left) * s, y: (clientY - r.top) * s };
}
cv.addEventListener('pointerdown', e => {
  const pt = toCanvasPoint(e.clientX, e.clientY);
  if(stageIndex === 3){
    const d = Math.hypot(pt.x - cx, pt.y - cyRing);
    if(d <= CORE_RADIUS){ hitCoreIfNeeded(); return; }
  }
  if(stageIndex === 2){
    const sx = cx + SQUARE.x, sy = cyB + SQUARE.y;
    if(Math.abs(pt.x - sx) <= SQUARE.w/2 && Math.abs(pt.y - sy) <= SQUARE.h/2){
      squareRevealed = true; return;
    }
  }
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, pt);
});
window.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = toCanvasPoint(e.clientX, e.clientY);
  pointers.set(e.pointerId, cur);
  if(pointers.size === 1){
    const dx = cur.x - prev.x, dy = cur.y - prev.y;
    const f = speedFactor(paddleY);
    paddleX = Math.min(Math.max(paddleX + dx*f, PADDLE_X_MIN), PADDLE_X_MAX);
    paddleY = Math.min(Math.max(paddleY + dy*f, PADDLE_Y_MIN), PADDLE_Y_MAX);
  } else if(pointers.size >= 2){
    const pts = [...pointers.values()].sort((a,b)=>a.x-b.x);
    const left = pts[0], right = pts[pts.length-1];
    paddleTilt = Math.min(Math.max((right.y - left.y) * 0.15, -20), 20);
  }
});
function releasePointer(e){ pointers.delete(e.pointerId); }
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
document.getElementById('tiltL').onclick = () => { paddleTilt = Math.max(paddleTilt - 8, -20); };
document.getElementById('tiltR').onclick = () => { paddleTilt = Math.min(paddleTilt + 8, 20); };

// ---- frame ----
function drawFrame(){
  ctx.strokeStyle = '#7fe3d4'; ctx.lineWidth = 1.5;
  ctx.strokeRect(6, 6, W-12, H-12);
  const L = 26;
  const corners = [[6,6,1,1],[W-6,6,-1,1],[6,H-6,1,-1],[W-6,H-6,-1,-1]];
  corners.forEach(([x,y,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(x, y + L*sy); ctx.lineTo(x, y); ctx.lineTo(x + L*sx, y); ctx.stroke();
    for(let i=1;i<=3;i++){
      ctx.beginPath(); ctx.moveTo(x + i*7*sx, y); ctx.lineTo(x + i*7*sx, y + 5*sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + i*7*sy); ctx.lineTo(x + 5*sx, y + i*7*sy); ctx.stroke();
    }
  });
  ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle = 'rgba(127,227,212,0.3)';
  ctx.beginPath(); ctx.moveTo(10, PADDLE_Y_MIN); ctx.lineTo(W-10, PADDLE_Y_MIN); ctx.stroke();
  ctx.restore();
}

function dotFill(w,h,spacing){
  spacing = spacing || 7;
  ctx.fillStyle = 'rgba(127,227,212,0.10)';
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle = '#7fe3d4';
  for(let dy=-h/2+3; dy<h/2; dy+=spacing){
    for(let dx=-w/2+3; dx<w/2; dx+=spacing){
      ctx.beginPath(); ctx.arc(dx,dy,1,0,Math.PI*2); ctx.fill();
    }
  }
}
function solidStyle(){ ctx.fillStyle = 'rgba(127,227,212,0.16)'; ctx.strokeStyle = '#7fe3d4'; ctx.lineWidth = 1.5; }
function symmetricBucketIsTarget(c, cols){
  const bucket = Math.floor(Math.abs(c - (cols-1)/2));
  return bucket % 2 === 0;
}

// ================= Stage 1: シンプルな王道ブロック崩し(上にずらし、行ごとに性質を変える) =================
const classicTargets = [], classicJammers = [];
(function buildClassic(){
  const cols = 8, bw = 38, bh = 16, gap = 6;
  const rowW = cols*bw + (cols-1)*gap;
  const startX = -rowW/2 + bw/2;
  const rowStep = bh + gap;
  // row0: ハードブロック(3回で壊れる・密な点), row1: 空,
  // row2: 通常/ジャマーが左右対称に混在, row3: 空, row4-5: 通常ブロック
  for(let c=0;c<cols;c++) classicTargets.push({x:startX+c*(bw+gap), y:0*rowStep, w:bw,h:bh, hp:3, dense:true});
  for(let c=0;c<cols;c++){
    const x = startX+c*(bw+gap), y = 2*rowStep;
    if(symmetricBucketIsTarget(c,cols)) classicTargets.push({x,y,w:bw,h:bh,hp:1,dense:false});
    else classicJammers.push({x,y,w:bw,h:bh});
  }
  [4,5,6].forEach(r => {
    for(let c=0;c<cols;c++) classicTargets.push({x:startX+c*(bw+gap), y:r*rowStep, w:bw,h:bh, hp:1, dense:false});
  });
})();
function drawClassic(){
  const anchorY = 90; // 上にずらす
  classicTargets.forEach(o => {
    ctx.save(); ctx.translate(cx+o.x, anchorY+o.y);
    dotFill(o.w,o.h, o.dense ? 4 : 7);
    ctx.beginPath(); ctx.rect(-o.w/2,-o.h/2,o.w,o.h);
    ctx.strokeStyle='#7fe3d4'; ctx.lineWidth=1.2; ctx.stroke();
    if(o.hp>=2){ ctx.fillStyle='#dff7f2'; ctx.font='11px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(o.hp),0,0); }
    ctx.restore();
  });
  classicJammers.forEach(o => {
    ctx.save(); ctx.translate(cx+o.x, anchorY+o.y);
    solidStyle(); ctx.beginPath(); ctx.rect(-o.w/2,-o.h/2,o.w,o.h); ctx.fill(); ctx.stroke();
    ctx.restore();
  });
}

// ================= Stage 2: 非リング面 =================
const targets = [
  {shape:'circle', x:-150, y:-55, r:22, hp:13},
  {shape:'circle', x:150,  y:-55, r:22, hp:13},
];
const jammers = [
  // 穴の外側、玉2個分ほど離した位置の回転ジャマー
  {shape:'cross', x:-75, y:-100, size:34, motion:{type:'rotate', speed:1.3}, curAngle:0},
  {shape:'cross', x:75,  y:-100, size:34, motion:{type:'rotate', speed:-1.3}, curAngle:0},
  // 三角ジャマー: 中央寄りに移動し回転させる
  {shape:'triangle', x:-148, y:70, size:42, motion:{type:'rotate', speed:0.7}, curAngle: 200*Math.PI/180},
  {shape:'triangle', x:148,  y:70, size:42, motion:{type:'rotate', speed:-0.7}, curAngle: -20*Math.PI/180},
  {shape:'bar', x:-70, y:130, w:70, h:12, motion:{type:'slide', axis:'x', amplitude:40, speed:0.9, phase:0}},
  {shape:'bar', x:70,  y:130, w:70, h:12, motion:{type:'slide', axis:'x', amplitude:40, speed:0.9, phase:Math.PI}},
];
// 下部ブロック2段: 交互配置を段ごとにずらす(チェッカー柄)
(function addBrickRows(){
  const cols = 8, bw = 34, bh = 14, gap = 6;
  const rowW = cols*bw + (cols-1)*gap;
  const startX = -rowW/2 + bw/2;
  [160, 186].forEach((y, ri) => {
    for(let c=0; c<cols; c++){
      const item = {shape:'brick', x: startX + c*(bw+gap), y, w:bw, h:bh};
      const isTarget = (ri === 0) ? (c % 2 === 0) : (c % 2 !== 0);
      if(isTarget) targets.push({...item, hp:1});
      else jammers.push({...item, motion:{type:'static'}});
    }
  });
})();

function drawTriangle(size){
  ctx.beginPath();
  ctx.moveTo(0,-size/2); ctx.lineTo(size/2,size/2); ctx.lineTo(-size/2,size/2); ctx.closePath();
}
function drawCross(size){
  const a = size/3.2;
  ctx.beginPath(); ctx.rect(-size/2,-a/2,size,a); ctx.rect(-a/2,-size/2,a,size);
}
// 四角(中心y=-100、半辺35→上辺-135/下辺-65/左右辺±35)に対する凹ブラケットの寸法
const BR_LT = 16;    // 脚の太さ
const BR_CAP = 16;   // 上下キャップの高さ
const BR_LEG = 20;   // 脚が四角の側面に沿って伸びる長さ(これにより穴の高さ=70-2*20=30)
function drawConcaveBrackets(){
  // 四角が「凹」の中にはまる形: 上下にキャップ+側面に沿う脚。脚が届かない中央帯だけが横穴
  solidStyle();
  const rect = (x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.rect(cx+x0, cyB+y0, x1-x0, y1-y0); ctx.fill(); ctx.stroke(); };
  // 上ブラケット: キャップ(全幅) + 左右の脚(四角の上辺から下に20pxだけ側面を覆う)
  rect(-35-BR_LT, -135-BR_CAP, 35+BR_LT, -135);
  rect(35, -135, 35+BR_LT, -135+BR_LEG);
  rect(-35-BR_LT, -135, -35, -135+BR_LEG);
  // 下ブラケット: 上と上下対称
  rect(-35-BR_LT, -65, 35+BR_LT, -65+BR_CAP);
  rect(35, -65-BR_LEG, 35+BR_LT, -65);
  rect(-35-BR_LT, -65-BR_LEG, -35, -65);
  // 脚が届かない中央帯(y:-135+20 〜 -65-20 = -115〜-85)が唯一の横穴
}
function drawBastion(elapsed, dt){
  drawConcaveBrackets();
  // 中央の四角(タップで数値確定・傾きなし)
  ctx.save();
  ctx.translate(cx+SQUARE.x, cyB+SQUARE.y);
  dotFill(SQUARE.w, SQUARE.h);
  ctx.beginPath(); ctx.rect(-SQUARE.w/2,-SQUARE.h/2,SQUARE.w,SQUARE.h);
  ctx.strokeStyle='#7fe3d4'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.fillStyle='#dff7f2'; ctx.font='13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(squareRevealed ? String(SQUARE.hp) : '?', 0, 0);
  ctx.restore();

  targets.forEach(o => {
    ctx.save(); ctx.translate(cx + o.x, cyB + o.y);
    if(o.shape === 'circle'){ dotFill(o.r*2, o.r*2); ctx.beginPath(); ctx.arc(0,0,o.r,0,Math.PI*2); }
    else { dotFill(o.w, o.h); ctx.beginPath(); ctx.rect(-o.w/2,-o.h/2,o.w,o.h); }
    ctx.strokeStyle='#7fe3d4'; ctx.lineWidth=1.2; ctx.stroke();
    if(o.hp>=2){ ctx.fillStyle='#dff7f2'; ctx.font='11px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(o.hp),0,0); }
    ctx.restore();
  });
  jammers.forEach(o => {
    let ox=o.x, oy=o.y, oa=0;
    if(o.motion.type==='rotate'){ o.curAngle += o.motion.speed*dt; oa = o.curAngle*180/Math.PI; }
    else if(o.motion.type==='slide'){
      const off = Math.sin(elapsed*o.motion.speed+o.motion.phase)*o.motion.amplitude;
      if(o.motion.axis==='x') ox+=off; else oy+=off;
    }
    ctx.save(); ctx.translate(cx+ox, cyB+oy); ctx.rotate((oa*Math.PI)/180);
    solidStyle();
    if(o.shape==='cross') drawCross(o.size);
    else if(o.shape==='triangle') drawTriangle(o.size);
    else { ctx.beginPath(); ctx.rect(-o.w/2,-o.h/2,o.w,o.h); }
    ctx.fill(); ctx.stroke();
    ctx.restore();
  });
}

// ================= Stage 3: 回転リング(距離を詰めて3枚に) =================
const rings = [
  {radius:50,  segments:6,  arcDeg:42, vel:0.5},
  {radius:76,  segments:8,  arcDeg:34, vel:-0.38},
  {radius:102, segments:10, arcDeg:28, vel:0.26}
];
let ringAngles = rings.map(()=>0);
function drawRings(dt){
  ctx.strokeStyle = '#7fe3d4';
  rings.forEach((ring,i)=>{
    if(!reduceMotion) ringAngles[i] += ring.vel*dt;
    const step=(Math.PI*2)/ring.segments, arcRad=(ring.arcDeg*Math.PI)/180;
    ctx.lineWidth=10;
    for(let s=0;s<ring.segments;s++){
      const a0=ringAngles[i]+s*step, a1=a0+arcRad;
      ctx.beginPath(); ctx.arc(cx,cyRing,ring.radius,a0,a1); ctx.stroke();
    }
  });
  ctx.beginPath(); ctx.arc(cx,cyRing,CORE_RADIUS,0,Math.PI*2);
  ctx.fillStyle='rgba(127,227,212,0.10)'; ctx.fill();
  ctx.strokeStyle='#7fe3d4'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#dff7f2'; ctx.font='14px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(ringCoreHp===null?'?':String(ringCoreHp), cx, cyRing);
}

function drawPaddle(){
  ctx.save(); ctx.translate(paddleX,paddleY); ctx.rotate((paddleTilt*Math.PI)/180);
  ctx.fillStyle='#dff7f2'; ctx.fillRect(-PADDLE_HALF_W,-6,PADDLE_HALF_W*2,12);
  ctx.restore();
}

let lastT=0;
function loop(t){
  const dt = lastT ? (t-lastT)/1000 : 0; lastT=t;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#0f1630'; ctx.fillRect(0,0,W,H);
  drawFrame();
  if(stageIndex===1) drawClassic();
  else if(stageIndex===2) drawBastion(t/1000, dt);
  else drawRings(dt);
  drawPaddle();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
